enabled: true
drop-on-death: true
settings:
  only-pvp: false
  drop-chance: 1.0
  death-time-format: "dd.MM.yyyy HH:mm"

# SkinsRestorer integration — resolves skins for offline players' heads.
# SMPS must share the same MySQL connection as SkinsRestorer.
skinsrestorer:
  enabled: true
  # Database name where SkinsRestorer tables live
  database: "s3_SkinsRestorer"
  # Table names (default for SkinsRestorer v15+)
  tables:
    # uuid → value, signature (player's own skin texture)
    player-skins: "sr_player_skins"
    # url → value, signature (URL-based custom skins)
    url-skins: "sr_url_skins"
    # uuid → skin_identifier, skin_type (maps player to their active skin)
    players: "sr_players"
