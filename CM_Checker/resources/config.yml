# Checker module configuration
commands:
  check:
    enabled: true

features:
  freeze: true
  block-actions: true
  block-commands: true
  blindness: true
  confirm-sphere: true
  title: true
  actionbar: true
  chat-reminder: true

settings:
  admin-command-highlight: true
  admin-log-format: "&7[&6CMD&7] &e{sender} &7> &f{command}"
  actionbar-interval-ticks: 40
  chat-interval-ticks: 200
  title:
    fade-in: 10
    stay: 60
    fade-out: 10

ban:
  command: "ban {player} {duration} {reason}"
  duration: "30d"
  reason: "Правило 5.1. Если хотите обжаловать - создайте тикет в поддержке."
  reasons:
    failed: "Не прошел проверку администрации."
    denied: "Отказался от проверки администрации."
    rejected: "Отказался от проверки администрации."
    quit: "Вышел с сервера во время проверки администрации."
