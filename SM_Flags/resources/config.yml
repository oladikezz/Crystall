commands:
  flags:
    enabled: true

# ============================================================
# Webhook Groups — каждая группа имеет URL вебхука и список флагов.
# Флаг может принадлежать только одной группе.
# Если webhook_groups не задан — используются старые discord.webhook-url
# и discord.storage-webhook-url для обратной совместимости.
# ============================================================
webhook_groups:
  main:
    webhook: "your-webhook-url-here"
    flags:
      - tnt_inventory
      - lava_placement
      - tnt_placement_overworld
      - tnt_placement_nether
      - fire_ignite
      - villager_kill
      - pet_kill
      - end_crystal_explode
      - end_crystal_damage_entity
      - end_crystal_damage_player
      - chat_spam
      - chat_repeat
      - player_kill
      - container_explosion
      - container_burn
      - container_break
      - shulker_break
      - wither_summon_overworld
      - wither_summon_nether
      - wither_summon_end
      - wither_container_destroy
      - rare_item
      - container_drop
      - big_data_item_interact
  mods:
    webhook: "your-webhook-url-here"
    flags:
      - admin_ban
      - admin_warn
      - admin_mute
      - whitelist_add
      - op_grant
  ores:
    webhook: "your-webhook-url-here"
    flags:
      - ore_pickup
      - ancient_debris_pickup
  storage:
    webhook: "your-webhook-url-here"
    flags:
      - boat_chest_place
      - boat_chest_enter
      - boat_chest_exit
      - boat_chest_interact

# Для обратной совместимости (используется если webhook_groups отсутствует)
discord:
  webhook-url: "your-webhook-url-here"
  storage-webhook-url: "your-webhook-url-here"

settings:
  # Cooldown per severity level (seconds)
  # HIGH (red) — fires almost always, minimal cooldown
  cooldown-high-seconds: 2
  # MEDIUM (yellow) — moderate cooldown
  cooldown-medium-seconds: 30
  # LOW (green) — longest cooldown
  cooldown-low-seconds: 60
  # How long to show action bar messages (seconds)
  actionbar-duration-seconds: 5
  # Maximum history events to store
  history-size: 200
  # Показывать флаги кликабельным сообщением в чате (с кнопкой [TP])
  chat-notifications: true

# ============================================================
# Чувствительность по времени игры
#
# Чем меньше наигранного времени — тем чувствительнее флаги.
# Пороги (threshold) каждого флага умножаются на multiplier тира.
# Например, threshold=10 с multiplier=0.25 → порог становится 3.
#
# Тиры (настраиваемые):
#   newcomer  — <1ч          → x0.25 (суперчувствительный)
#   beginner  — 1ч – 10ч     → x0.5
#   regular   — 10ч – 50ч    → x0.75
#   veteran   — 50ч – 200ч   → x1.0  (стандарт)
#   elder     — >200ч        → x1.5  (наименее чувствительный)
#
# Данные берутся из таблицы sm_playtime_stats (total_minutes).
# ============================================================
playtime-sensitivity:
  enabled: true
  tiers:
    newcomer:
      max-minutes: 60
      threshold-multiplier: 0.25
    beginner:
      max-minutes: 600
      threshold-multiplier: 0.5
    regular:
      max-minutes: 3000
      threshold-multiplier: 0.75
    veteran:
      max-minutes: 12000
      threshold-multiplier: 1.0
    elder:
      threshold-multiplier: 1.5

# ============================================================
# Периодическое напоминание для первых 2 тиров (<10 часов)
# Поддерживаются MiniMessage теги + &[MAIN]/&[SECONDARY] цвета SMPS
# ============================================================
playtime-reminder:
  enabled: true
  interval-seconds: 15
  target-tiers: [newcomer, beginner]
  # По умолчанию 10 часов (600 минут)
  max-minutes: 600
  message: "&[SECONDARY]Подсказка: используйте &[MAIN]/rtp &[SECONDARY]и прочитайте правила. До &[MAIN]10ч &[SECONDARY]осталось: <yellow>{hours_left}ч</yellow>."

# ============================================================
# Автобан — если на сервере нет администрации (smflags.menu),
# после N срабатываний флага игрок будет забанен.
# ============================================================
auto-ban:
  ban-reason: "Система сочла ваше поведение подозрительным, если не согласны с баном - откройте жалобу на сайте"
  # Команда для бана. {player} и {reason} будут заменены
  ban-command: "ban {player} {reason}"
  rules:
    villager_kill:
      enabled: true
      triggers: 5
    container_break:
      enabled: true
      triggers: 10
    wither_summon_overworld:
      enabled: true
      triggers: 7
    wither_summon_nether:
      enabled: true
      triggers: 14
    wither_summon_end:
      enabled: true
      triggers: 16
    container_explosion:
      enabled: true
      triggers: 10

# ============================================================
# Флаги
#
# Каждый флаг может иметь секцию levels с уровнями опасности.
# Не обязательно указывать все три уровня — можно указать только
# те, которые нужны. Если levels отсутствует или ни один уровень
# не подошёл — используется стандартный уровень из кода.
#
# Условия (condition):
#   BELOW   — значение < value
#   BETWEEN — значение >= value И <= second-value
#   ABOVE   — значение > value
# ============================================================
flags:
  tnt_inventory:
    enabled: true
    threshold: 32
    # groups: [newcomer, beginner, regular, veteran, elder]  # Если не указано — работает для всех
    levels:
      low:
        condition: BELOW
        value: 32
      medium:
        condition: BETWEEN
        value: 32
        second-value: 128
      high:
        condition: ABOVE
        value: 128

  # Редкие предметы в инвентаре — срабатывает только для указанных групп
  rare_item:
    enabled: true
    # Группы игроков, для которых срабатывает флаг (по времени игры)
    # Доступные группы: newcomer, beginner, regular, veteran, elder
    groups: [newcomer, beginner]

    # ── Предметы (любое количество вызывает флаг, min-amount = 1) ──
    items:
      - ELYTRA
      - NETHER_STAR
      - DRAGON_EGG
      - ENCHANTED_GOLDEN_APPLE
      - TOTEM_OF_UNDYING
      - BEACON
      - DRAGON_HEAD
      - HEART_OF_THE_SEA
      - TRIDENT
      # Алмазная броня и инструменты
      - DIAMOND_HELMET
      - DIAMOND_CHESTPLATE
      - DIAMOND_LEGGINGS
      - DIAMOND_BOOTS
      - DIAMOND_SWORD
      - DIAMOND_PICKAXE
      - DIAMOND_AXE
      - DIAMOND_SHOVEL
      - DIAMOND_HOE
      # Незеритовая броня и инструменты
      - NETHERITE_HELMET
      - NETHERITE_CHESTPLATE
      - NETHERITE_LEGGINGS
      - NETHERITE_BOOTS
      - NETHERITE_SWORD
      - NETHERITE_PICKAXE
      - NETHERITE_AXE
      - NETHERITE_SHOVEL
      - NETHERITE_HOE
      # Ценные предметы
      - NETHERITE_INGOT
      - NETHERITE_BLOCK

    # ── Предметы с минимальным количеством ──
    # Флаг сработает только если общее кол-во в инвентаре >= указанного
    items-min-amount:
      SPONGE: 16
      WET_SPONGE: 16
      IRON_BLOCK: 16
      GOLD_BLOCK: 8
      DIAMOND_BLOCK: 4

    # ── Редкие зачарованные книги (зачарование:мин_уровень) ──
    # Триггерится когда игрок получает книгу с указанным зачарованием на уровне >= мин_уровень
    enchanted-books:
      - "soul_speed:3"
      - "protection:4"
      - "unbreaking:3"
      - "mending:1"
      - "wind_burst:3"
      - "swift_sneak:3"
      - "efficiency:5"
      - "sharpness:5"
      - "fortune:3"
      - "silk_touch:1"

    # ── Зачарованные предметы (не книги) ──
    # Предмет считается редким если имеет ЛЮБОЕ из перечисленных зачарований на указанном уровне
    enchanted-items:
      BOW:
        - "power:5"
        - "infinity:1"
      CROSSBOW:
        - "multishot:1"
        - "quick_charge:3"

    levels:
      low:
        condition: BELOW
        value: 3
      medium:
        condition: BETWEEN
        value: 3
        second-value: 5
      high:
        condition: ABOVE
        value: 5

  lava_placement:
    enabled: true
    min-height: 70
    # Нет value для уровней — используется стандартный уровень (LOW)

  whitelist_add:
