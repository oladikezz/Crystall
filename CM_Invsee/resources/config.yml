# ======== SM_Invsee ========
# /invsee <ник>   — открыть инвентарь игрока в меню на 54 слота (6 рядов —
#                   это максимум для меню-сундука; запрошенные «56»
#                   отображаются как полный 6-рядный сундук).
# /endersee <ник> — открыть эндер-сундук игрока (27 слотов).
#
# Права:
#   sminvsee.command       — открыть инвентарь (только просмотр)
#   sminvsee.edit          — забирать/класть предметы в инвентаре
#   sminvsee.endersee      — открыть эндер-сундук (только просмотр)
#   sminvsee.endersee.edit — забирать/класть предметы в эндер-сундуке
#
# Раскладка меню:
#   слоты 0-35  — инвентарь игрока (хотбар + основной), редактируемые
#   слоты 36-52 — разделитель (чёрное стекло)
#   слот  53     — голова игрока (информация)

messages:
  playerdata-not-found: "&cИгрок &f{player} &cне найден или у него нет сохранённого playerdata"
  playerdata-load-failed: "&cНе удалось прочитать playerdata игрока &f{player}"
  playerdata-save-failed: "&cНе удалось сохранить playerdata игрока &f{player}"
  # {player} заменяется на ник цели
  menu-title: "&8Инвентарь: &f{player}"
  players-only: "&cЭту команду может использовать только игрок"
  no-permission: "&cУ вас нет прав на эту команду"
  usage: "&cИспользование: &f/invsee <ник>"
  player-not-found: "&cИгрок &f{player} &cне в сети"
  self: "&cНельзя открыть свой собственный инвентарь"
  # endersee
  ender-menu-title: "&8Эндер-сундук: &f{player}"
  ender-usage: "&cИспользование: &f/endersee <ник>"
  ender-self: "&cНельзя открыть свой собственный эндер-сундук"
