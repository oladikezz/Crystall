# ======== SM_TrafficOptimizer ========
# Снижает объём данных, которые сервер шлёт КОНКРЕТНОМУ игроку, когда у него
# растёт пинг. Работает строго per-player: настройки других игроков и сервера
# не меняются никогда.
#
# Что модуль НЕ делает: он не уменьшает сетевую задержку как таковую. Если у
# игрока 150 мс из-за расстояния до сервера — они такими и останутся. Смысл в
# другом: когда канал игрока переполнен, служебные пакеты встают в очередь за
# потоком чанков, и пинг показывает 400 вместо реальных 150. Разгрузив канал,
# модуль убирает эту накрутку и снижает риск вылета по таймауту.
#
# Права:
#   smnetopt.admin  — команда /netopt
#   smnetopt.exempt — игрока не трогать никогда (для админов, стримеров)
#
# Команды:
#   /netopt status [ник]  — пинг, уровень, текущая и исходная прорисовка
#   /netopt list          — кто сейчас под оптимизацией
#   /netopt reset <ник>   — вернуть игроку исходные настройки
#   /netopt on | off      — включить/выключить на лету (off возвращает всем исходное)

enabled: true

# Как часто опрашивать игроков. 40 тиков = 2 секунды.
# Меньше 20 поставить нельзя — будет дёргать чанки чаще, чем они успевают доехать.
check-interval-ticks: 40

# Сообщать игроку, когда включается максимальный уровень.
notify-player: false

ping:
  # Сглаживание: 0.3 = новое значение весит 30%. Чем меньше, тем спокойнее
  # реакция. Нужно, чтобы одиночный скачок пинга не дёргал прорисовку.
  smoothing: 0.3
  # Сколько замеров собрать, прежде чем что-то делать. Защита от реакции
  # на мусорный пинг в первые секунды после захода.
  samples-before-acting: 5
  # Пороги в миллисекундах. Ниже light — модуль не вмешивается.
  thresholds:
    light: 200
    medium: 350
    aggressive: 550
  # Порог полного выхода из оптимизации (LIGHT -> NONE).
  # Обязан быть заметно ниже thresholds.light — иначе игрок будет болтаться
  # между уровнями. Если задать выше, модуль поправит сам.
  # Учтите: игрок со стабильными 150 мс так и останется на LIGHT — он ниже
  # порога 200, но выше 120. Это намеренно: именно такие и выигрывают от
  # урезанного потока. Хотите отпускать их полностью — поднимите значение.
  restore-below: 120
  # Запас на возврат между уровнями. Игрок с MEDIUM (взят на 350) уйдёт
  # на LIGHT при пинге ниже 350-50=300, не дожидаясь падения до 120.
  # Без этого запаса промежуточные уровни залипали бы надолго.
  hysteresis-margin: 50
  # Предохранитель от ложных срабатываний. Если медианный пинг ПО ВСЕМ игрокам
  # достиг этого значения — проблема почти наверняка на стороне сервера
  # (тормозят регионы, забит аплинк хоста), а не у отдельных игроков.
  # Резать им прорисовку в этой ситуации бесполезно, поэтому модуль встаёт
  # на паузу и пишет предупреждение в лог. 0 = выключить предохранитель.
  server-wide-guard: 300
  # И держаться ниже порога столько секунд подряд.
  restore-stable-seconds: 30

limits:
  # Ниже этих значений прорисовка не опустится ни при каком пинге.
  min-view-distance: 3
  min-simulation-distance: 3
  min-send-distance: 3
  # Сколько игроков за один проход могут вернуться на уровень выше.
  # Это главный предохранитель: возврат прорисовки вызывает досылку чанков,
  # и если разрешить всем восстановиться одновременно, получится всплеск
  # трафика — ровно то, чего мы избегаем. Не поднимайте без нужды.
  max-restores-per-cycle: 2
  # Минимальная пауза между изменениями уровня у одного игрока.
  change-cooldown-seconds: 8

# Отбрасывание пакетов частиц для игроков под оптимизацией.
# На ивентах и в замесах частицы занимают заметную долю канала, а на саму игру
# не влияют — их можно резать без последствий: пакет разовый, состояния клиента
# он не меняет, рассинхрона не будет.
#
# Обработчик ставится в сетевой канал ТОЛЬКО тем, кто сейчас под оптимизацией,
# и снимается сразу при возврате в NONE, при выходе игрока и при выключении
# модуля. У здоровых игроков в канале нет ничего — нагрузки на них ноль.
particles:
  enabled: true
  # Доля отбрасываемых пакетов на каждом уровне. 1.0 = не слать частицы вообще.
  drop-chance:
    light: 0.5
    medium: 0.8
    aggressive: 1.0
  # По каким классам пакетов узнавать частицы. Проверяется вхождение подстроки
  # в полное имя класса. Если на новой версии сервера класс переименуют, фильтр
  # просто перестанет срабатывать — ничего не сломается, но строку надо будет
  # поправить. Пустой список полностью отключает фильтр.
  packet-markers:
    - "ClientboundLevelParticlesPacket"

quiet-ban:
  # Не трогать игроков под тихим баном (SM_QuietBan). Их пинг задран
  # искусственно самим наказанием, оптимизировать его бессмысленно: модуль
  # будет бесконечно резать прорисовку, а пинг не упадёт. Плюс это ослабило бы
  # само наказание.
  skip-quiet-banned: true
  # Что делать, если SM_QuietBan установлен, но опросить его не удалось.
  # true = не трогать игрока (безопасно). false = оптимизировать как обычного.
  skip-when-status-unknown: true
