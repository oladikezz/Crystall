commands:
  trollitem:
    enabled: true

settings:
  bow:
    # Отображаемое имя выдаваемого лука.
    bow-name: "&c&lХуюк"
    # Максимальная дальность (в блоках), на которой лук цепляет игрока в прицеле.
    hook-range: 30.0
    # Расстояние (в блоках) перед стрелком, на которое подтягивается зацепленный игрок.
    hook-distance: 2.0
    # Множитель скорости запуска при выстреле (умножается на силу натяжения 0.0-1.0).
    launch-power: 3.0
    # Урон при столкновении с блоком после запуска (10.0 = 5 сердец).
    collision-damage: 10.0

  handcuffs:
    # Отображаемое имя выдаваемой палочки.
    wand-name: "&e&lНаручники"
    # Расстояние в блоках: одновременно (1) максимум, на котором можно сковать двух игроков
    # ударом палочки, и (2) длина поводка, после превышения которой ведомого подтягивает.
    pull-distance: 5.0
    # Сколько секунд ждать удара по второму игроку после первого, прежде чем выбор сбросится.
    selection-timeout-seconds: 20
    # Цвет частиц поводка (R,G,B).
    leash-particle-color: "40,40,40"
    # Расстояние между частицами вдоль линии поводка (в блоках).
    leash-particle-spacing: 0.4
    # Как часто (в тиках) перерисовывать линию поводка.
    leash-particle-interval-ticks: 2

  bomb:
    # Отображаемое имя выдаваемой бомбы.
    bomb-name: "&5&lГравитационная бомба"
    # Радиус (в блоках) от точки взрыва, в котором игроков затягивает.
    pull-radius: 8.0
    # Сколько тиков длится рывок скоростью к центру (20 тиков = 1 секунда).
    pull-duration-ticks: 15
    # Скорость затягивания (блоков за тик).
    pull-speed: 0.6
    # Если после рывка игрок дальше этого расстояния от центра - его довезёт телепорт.
    teleport-threshold: 1.5
    # Высота стен клетки (блоков прутьев) между полом и потолком.
    cage-wall-height: 3
    # Через сколько секунд клетка исчезнет и всё восстановится.
    cage-duration-seconds: 10
    # Кулдаун между бросками бомбы (в секундах).
    throw-cooldown-seconds: 3
    # Сколько снежков-бомб выдаётся за раз (бросок настоящий, снежок расходуется).
    bomb-stack-size: 16
    # Исключать ли самого бросающего из затягивания собственной бомбой.
    # Поставь false, если тестируешь в одиночку и хочешь проверить стягивание/клетку на себе.
    exclude-thrower: true
