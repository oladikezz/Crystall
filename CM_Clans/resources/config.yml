# Clans module configuration
prefix:
  enabled: true

clans:
  min-tag-length: 2
  max-tag-length: 10
  min-name-length: 3
  max-name-length: 255
  min-description-length: 1
  max-description-length: 128
  allow-colored-tags: true
  allow-colored-names: false

  # Member slots a brand-new clan starts with. Clans can buy more, up to
  # economy.costs.slot-increase.max-slots (50 by default).
  default-member-slots: 4

  tag-activation:
    enabled: false
    min-members: 3

chat:
  prefix: "*"

roles:
  allow-custom-roles: false

broadcast:
  clan-created: true
  player-joined: true
  player-left: true
  player-kicked: true
  clan-disbanded: true

# ─────────────────────────────────────────────────────────────────────────
# Economy - clans pay for actions with ore (diamond ore / deepslate diamond ore)
# ─────────────────────────────────────────────────────────────────────────
# Every clan has a treasury (balance) measured in "ore units" (1 ore item = 1 unit).
# Only the leader and co-leaders may deposit into / withdraw from the treasury.
# Most paid actions are drawn from the treasury. Clan CREATION is the exception:
# it is paid from the creating player's own inventory (there is no treasury yet).
economy:
  enabled: true

  # When true, everything a clan spends through its treasury (rent + all paid actions)
  # is funnelled into the server-wide "president" tax pool instead of being destroyed.
  # The president (permission smclans.taxes) views and withdraws it with /clan taxes.
  # Set false to restore the old behaviour where spent ore is simply voided.
  president-taxes: true

  # Items accepted as currency. Both count interchangeably (each item = 1 unit).
  currency-materials:
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE

  # Material handed back when withdrawing from the treasury.
  payout-material: DIAMOND_ORE

  costs:
    # Paid from the creating player's inventory (no treasury exists yet).
    clan-creation: 64

    # Paid from the clan treasury. Status (privacy) and friendly-fire are NOT priced.
    settings:
      name: 8
      description: 4
      tag: 8
      banner-color: 4

    # Setting a custom banner/flag from a held banner item. Paid from treasury.
    custom-banner: 16

    # Buying extra member slots. Paid from treasury.
    slot-increase:
      cost-per-slot: 16        # treasury cost for each single slot
      slots-per-purchase: 1   # how many slots one purchase grants
      max-slots: 50          # hard cap a clan can reach via purchases

  # Weekly rent, drawn automatically from the treasury. If a clan cannot pay,
  # it is archived and disbanded; an admin can restore it with /clan admin restore.
  rent:
    enabled: true
    # Rent scales with the clan's CURRENT member count. Each entry is "members: ore".
    # Counts above the largest tier add `per-extra-member` ore for every member beyond it
    # (e.g. with the table below, 11 members = 64 + 12 = 76, 12 = 88, and so on).
    amount-by-members:
      1: 16
      2: 20
      3: 24
      4: 28
      5: 32
      6: 38
      7: 42
      8: 46
      9: 52
      10: 64
    per-extra-member: 12
    # Fallback flat rent, used only if amount-by-members is empty/missing.
    amount: 32
    period-days: 7
    # How often (minutes) the rent checker runs.
    check-interval-minutes: 30

# ─────────────────────────────────────────────────────────────────────────
# Audit log - every clan treasury action (purchases, rent, disbands) is posted
# to a Discord webhook as an embed. Sending is async and rate-limited so it can
# never block the server or trip Discord's limits.
# ─────────────────────────────────────────────────────────────────────────
audit-log:
  enabled: false
  webhook-url: ""
  # Display name shown on the webhook messages.
  username: "Clan Audit"
  # Minimum milliseconds between webhook posts (steady-state rate-limit protection).
  min-interval-ms: 2000
  # Max queued messages before the oldest are dropped (guards against backlog on outage).
  queue-limit: 200
  # Tax-collection (president pool) events fire on every treasury charge. They are always
  # written to the log database; set this false to keep them out of the Discord webhook.
  log-tax-collect: true

# SkinsRestorer database integration for player heads in GUIs
# Uses SMPS multi-database to query SkinsRestorer DB directly
# Configure "database2" in SMPS config.yml pointing to s3_SkinsRestorer
skinsrestorer-db:
  enabled: true
  # The SMPS database key (database2, database3, etc.)
  database-key: "database2"
  # SkinsRestorer table name (with prefix). Usually "sr_player_skins"
  table: "sr_player_skins"

