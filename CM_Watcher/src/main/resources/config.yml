# ==========================================
# Watcher (Смотрящий) - Main Configuration
# ==========================================

# Skin texture and Mojang signed signature for Watcher Player NPC (ShaderCoder skin)
watcher:
  name: "<#800080><b>Наблюдатель</b>"
  # Entity mode: "PACKET_NPC" (Real Player NPC Model) or "ARMOR_STAND"
  entity-mode: "PACKET_NPC"
  # Signed Mojang texture Value and Signature for ShaderCoder
  head-texture: ""
  head-signature: ""
  glowing: true
  glow-color: "DARK_PURPLE" # reserved for future use
  ritual-cooldown-seconds: 15

# AI Brain LLM Integration (OpenRouter / OpenAI / DeepSeek)
ai:
  enabled: true
  provider: "OPENROUTER"
  api-key: ""
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  model: "openai/gpt-4o-mini"
  system-prompt: "Ты — атмосфера мистического Смотрящего в Minecraft. Сгенерируй ровно ОДНУ короткую фразу (5-8 слов) с действием или эмоцией Смотрящего в ответ на ситуацию игрока. Фраза должна начинаться с 'выражает ...' или глагола действия ('наблюдает ...', 'замер ...', 'чувствует ...', 'шепчет ...'). Примеры: 'выражает тихий интерес к твоим ранам', 'наблюдает с легким интересом за твоей работой', 'замер за твоей спиной во тьме'. НЕ пиши слово Смотрящий и НЕ используй кавычки!"
  chat-cooldown-seconds: 5
  chat-system-prompt: "Ты — древний мистический Смотрящий (The Watcher) из Междумирья в Minecraft. Игрок заговорил с тобой в чате. Ответь от третьего лица («Смотрящий выражает...», «Смотрящий видит...») или коротким пугающим пророчеством (до 8-14 слов). Если вопрос про лор (Междумирье, время, пустота, судьба) — дай глубокий мистический намек. Без кавычек."

# Streamer Live Stream Chat Trigger
streamer-trigger:
  enabled: true
  regex: "(?:Игрок|Player)?\\s*([A-Za-z0-9_]{3,16})?\\s*запустил\\s*стрим"

# Telegram Bot Control Panel & Live Event Logger
telegram:
  enabled: true
  bot-token: ""
  admin-chat-id: "" # Main Telegram Chat ID of the Administrator (e.g. 5009507299)
  log-chat-id: ""   # Optional separate channel / group chat ID for streaming logs (empty = uses admin-chat-id)
  logging:
    enabled: true
    spawns: true
    despawns: true
    jumpscares: true
    rituals: true
    media-triggers: true
    ai-dialogue: true
    admin-actions: true
    settings-changes: true

# Environment Triggers for automated events
triggers:
  cave-only: false
  night-only: false
  low-health-only: false

# Discord Webhook Notification settings
discord:
  enabled: false
  webhook-url: ""

# Freezing aura effect settings
freezing:
  enabled: true
  max-distance: 12.0

# Default spawn parameters
defaults:
  spawn-distance: 5.0
  duration-seconds: 30
  despawn-distance: 20.0
  position: "BEHIND"
  behavior: "STATIC"
  infinite-duration: false

# Autonomous behavior (1-5 times per 24 hours / rare atmospheric event)
autonomous:
  enabled: false
  min-delay-seconds: 7200
  max-delay-seconds: 21600
  per-player-cooldown-seconds: 14400

# Particle effects around Watcher
particles:
  enabled: true
