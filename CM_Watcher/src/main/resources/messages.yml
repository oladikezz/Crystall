# Messages configuration for Watcher plugin
# MiniMessage format supported (<gradient>, <color>, <bold>, etc.)

prefix: "<dark_gray>[<purple>Смотрящий</purple>]</dark_gray> "

watcher-broadcast-format: "<dark_gray>[<purple>Смотрящий</purple>]</dark_gray> <white>{message}</white>"

no-permission: "<red>У вас недостаточно прав для использования этой команды!</red>"
only-players: "<red>Эта команда доступна только игрокам.</red>"
player-not-found: "<red>Указанный игрок не найден на сервере.</red>"
config-reloaded: "<green>Конфигурация плагина успешно перезагружена!</green>"

spawn-success: "<green>Смотрящий успешно заспавнен у игрока <yellow>{player}</yellow>!</green>"
spawn-already-exists: "<yellow>У игрока <white>{player}</white> уже спавнится Смотрящий.</yellow>"
despawn-success: "<yellow>Смотрящий у игрока <white>{player}</white> был убран.</yellow>"
no-active-watcher: "<red>У игрока <white>{player}</white> сейчас нет активного Смотрящего.</red>"

chat-input-cancelled: "<red>Ввод отменен.</red>"
chat-input-invalid-number: "<red>Ошибка: введено нечисловое значение.</red>"
chat-input-success: "<green>Значение успешно обновлено!</green>"

event-created: "<green>Автоматическое событие <yellow>{id}</yellow> успешно создано!</green>"
