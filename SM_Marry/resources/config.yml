# ═══════════════════════════════════════════════════
#  SM_Marry - Настройки модуля браков
# ═══════════════════════════════════════════════════

commands:
  marry:
    enabled: true
  divorce:
    enabled: true

settings:
  # Время на подтверждение брака/развода (в секундах)
  confirmation-timeout: 30
  
  # Требовать ли обоих игроков онлайн для заключения брака
  require-both-online: true
  
  # Разрешить ли игрокам жениться на себе (для теста)
  allow-self-marry: false
  
  # Максимальное количество браков на одного игрока
  max-marriages-per-player: 1
  
  # Публичные объявления о браках и разводах на весь сервер
  broadcast-marriages: true
  broadcast-divorces: false
  
  # Звуки котов при браках и разводах
  sounds:
    enabled: true
    marriage-sound: ENTITY_CAT_PURR
    divorce-sound: ENTITY_CAT_HISS
    volume: 1.0
    pitch: 1.0
  
  # Фантомный урон для партнёра (визуальная анимация удара без реального урона)
  shared-damage:
    enabled: true
  
  # Звук когда один партнёр бьёт другого (PvP между парой)
  partner-pvp-sound:
    enabled: true
    sound: ENTITY_CAT_HURT
    volume: 1.0
    pitch: 1.0
  
  # ── Взаимодействия между партнёрами ──────────────────
  interactions:
    # Shift+ПКМ по партнёру → Погладить (сердечки + сообщение)
    pat:
      enabled: true
      sound: ENTITY_CAT_PURREOW
      sound-volume: 1.0
      sound-pitch: 1.2
      particle-count: 8
      particle-spread: 0.35
    
    # Shift+ЛКМ по партнёру → Шлёпнуть по попке (сообщение)
    spank:
      enabled: true
      sound: ENTITY_PLAYER_ATTACK_SWEEP
      sound-volume: 1.0
      sound-pitch: 1.5
      particle-count: 5
      particle-spread: 0.3

# ── Права доступа (каскадные) ─────────────────────────
# smmarry.admin  → все права priest + use + принудительные команды
# smmarry.priest → все права use + /marry nick nick, /divorce nick nick
# smmarry.use    → /marry confirm|deny|info|list, /divorce confirm|deny
