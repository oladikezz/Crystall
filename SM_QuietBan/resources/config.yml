# ============================================================
# SM_QuietBan — теневой бан
#
# Эффект применяется точечно к сетевому каналу ОДНОГО игрока:
# обработчик встраивается в его личный netty-пайплайн, поэтому
# на других игроков и на TPS сервера он не влияет.
#
# Права:
#   smquietban.manage — доступ к /quietban, /unquietban, /checkquietban.
#                       Без этого права команды не видны в подсказках,
#                       а при вводе сервер отвечает стандартной
#                       ошибкой "неизвестная команда".
#   smquietban.bypass — иммунитет, теневой бан не применяется.
# ============================================================

# Как часто (в тиках) проверять истёкшие баны. 200 тиков = 10 секунд.
check-interval-ticks: 200

# Снимать ли вместе с основным баном все баны, автоматически
# выданные по его IP (альт-аккаунты).
unban-removes-ip-linked: true

# Писать ли выдачу, снятие и авто-баны по IP в консоль.
log-to-console: true

# Жёсткий потолок задержки в миллисекундах.
# Держите его заметно ниже таймаута keep-alive (30 секунд),
# иначе игрока выкинет с сервера, а не просто залагает.
max-delay-ms: 5000

# ============================================================
# Уровни теневого бана.
#
#   outbound-delay-ms  — задержка пакетов сервер -> игрок
#   inbound-delay-ms   — задержка пакетов игрок -> сервер
#   jitter-ms          — случайная добавка к задержке (рывки пинга)
#   packet-drop-chance — доля отбрасываемых входящих пакетов (0.0 - 1.0)
#
# Пинг, который видит игрок, примерно равен
# outbound-delay-ms + inbound-delay-ms + половина jitter-ms.
# ============================================================
levels:

  # Тихий: играть можно, но неприятно. Редкие рывки, пинг ~150 мс.
  quiet:
    outbound-delay-ms: 80
    inbound-delay-ms: 60
    jitter-ms: 70
    packet-drop-chance: 0.04

  # Средний: игра тяжёлая, но проходимая. Пинг ~500 мс, заметные откаты.
  medium:
    outbound-delay-ms: 260
    inbound-delay-ms: 220
    jitter-ms: 180
    packet-drop-chance: 0.22

  # Агрессивный: играть невозможно. Пинг ~2.5 секунды, половина действий теряется.
  aggressive:
    outbound-delay-ms: 1400
    inbound-delay-ms: 1100
    jitter-ms: 700
    packet-drop-chance: 0.6

# ============================================================
# Какие входящие пакеты можно отбрасывать.
# Это БЕЛЫЙ список: всё, чего здесь нет, всегда доходит до сервера.
# Так keep-alive, чат, инвентарь и вход в мир не ломаются —
# теряются только движение и действия.
#
# Сравнение идёт по вхождению строки в полное имя класса пакета,
# поэтому вложенные варианты (Pos, PosRot, Rot) тоже попадают под правило.
# ============================================================
droppable-packets:
  - MovePlayerPacket
  - MoveVehiclePacket
  - SwingPacket
  - PlayerActionPacket
  - PlayerInputPacket
  - PlayerCommandPacket
  - UseItemPacket
  - UseItemOnPacket
  - InteractPacket
  - SetCarriedItemPacket
