# ======== SM_Crowns - Настройки ========

settings:
  # Интервал обновления корон (в тиках, 20 = 1 секунда)
  # Используется для отслеживания смены групп и прав
  update-interval: 200

  # Высота короны относительно ника игрока (в блоках)
  # 0 = на уровне ника, положительное = выше
  # Подбирайте значение по вкусу (0.2 - 0.5 обычно хорошо)
  crown-height: 0.3

  # Примечание: короны реализованы через TextDisplay-пассажиры.
  # Поддерживают телепорт, точную настройку высоты и прозрачный фон.

# ======== Команды ========
commands:
  crowns:
    enabled: true

# ======== Настройка ролей ========
# Каждая роль определяет корону для конкретной группы LuckPerms.
# Порядок в конфиге = приоритет. Первая подходящая роль побеждает.
#
# Параметры:
#   prefix     - текст над ником игрока (поддерживает цветовые коды &c, &#RRGGBB)
#   permission - право из LuckPerms (smcrowns.group.<имя> — назначается вручную)
#
# Примеры префиксов:
#   "&c👑"          - красная корона
#   "&#FF5555👑"    - корона в HEX-цвете
#   "&6⚜"          - золотой символ лилии вместо короны

roles:
  owner:
    prefix: "&c👑"
    permission: "smcrowns.group.owner"

  admin:
    prefix: "&4👑"
    permission: "smcrowns.group.admin"

  moderator:
    prefix: "&e👑"
    permission: "smcrowns.group.moderator"

  helper:
    prefix: "&a👑"
    permission: "smcrowns.group.helper"
