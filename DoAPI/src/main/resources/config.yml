# ====================================
# DoAPI - Конфигурация
# Автор: deforce_
# ====================================


# ======== Основные настройки ========
# Префикс сообщений
prefix: "&6[&eDoAPI&6]&r"

# Цветовая схема плагина
# Поддерживаются форматы:
# 1. Hex: "&#RRGGBB" или "#RRGGBB" (например "&#f44d89" или "#ff00ff")
# 2. Legacy: "&d", "&b", etc
main-color: "&#f44d89"
secondary-color: "&#FFA1C4"

# ====== debug ======
debug: true

# Логирование в файл
file-logging: true

# Уровень детализации (BASIC, DETAILED, VERBOSE)
detail-level: DETAILED

# Логировать события модулей
log-module-events: true

# Логировать команды
log-commands: true

# Логировать листенеры
log-listeners: true

# Логировать планировщик задач
log-scheduler: true

# ======== Discord Webhook (ошибки) ========
# Если указан URL вебхука, DoAPI будет отправлять ошибки в Discord.
# Ошибки отправляются как embed, а если текст слишком большой - как .txt файл.
# DoAPI также попытается определить, какой модуль вызвал ошибку.
# Rate limit: максимум 1 сообщение в 5 секунд для защиты от спама.
webhook:
  # URL вебхука Discord (оставьте пустым для отключения)
  url: ""
  # Включить/выключить отправку (даже если URL задан)
  enabled: true
  # Отправлять также предупреждения (жёлтый embed), а не только ошибки (красный embed)
  send-warnings: true

# =================

auto-load-modules: true

# Список модулей, которые не будут загружаться автоматически при старте
# (только если auto-load-modules: true)
ignored-modules:
  - "ExampleModule"

database:
  # Тип БД: mysql, mariadb, sqlite, h2
  # По умолчанию MySQL (рекомендуется для продакшена)
  type: mysql

  # MySQL / MariaDB настройки
  host: localhost
  port: 3306
  database: SMPS
  username: root
  password: ''

  # Настройки пула соединений (HikariCP)
  pool:
    size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

  # Префикс таблиц (по умолчанию sm_)
  table-prefix: sm_

  # Путь к файлу для SQLite/H2 (относительно папки плагина/data)
  file: database

# ======== Дополнительные подключения к БД ========
# Можно добавить database2, database3, ... для подключения к нескольким БД
# на одном и том же сервере (или разных серверах).
# Первая (database) - primary, используется модулями по умолчанию.
# /doapi database покажет информацию обо всех подключениях и их правах.
#
# Пример: подключение к другой базе на том же сервере
# database2:
#   type: mysql
#   host: localhost
#   port: 3306
#   database: s3_SkinsRestorer
#   username: root
#   password: ''
#   pool:
#     size: 5
#     connection-timeout: 30000
#     idle-timeout: 600000
#     max-lifetime: 1800000
#   table-prefix: sr_
#   file: database2
#
# database3:
#   type: mysql
#   host: localhost
#   port: 3306
#   database: s3_other
#   username: root
#   password: ''
#   pool:
#     size: 5
#     connection-timeout: 30000
#     idle-timeout: 600000
#     max-lifetime: 1800000
#   table-prefix: sm_
#   file: database3
