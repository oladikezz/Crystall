# ============================================================
# SM_StonecutterAdditions - Configuration
#
# Adds missing stonecutter recipes for blocks that logically
# should be cuttable: deepslate, wood, and stone variants.
#
# Each category can be toggled on/off independently.
# ============================================================

# Deepslate: raw DEEPSLATE → all cobbled/polished/brick/tile variants
deepslate:
  enabled: true

# Wood: planks → stairs, slabs, fences, signs, doors, etc.
# Also: logs → planks, stripped logs
wood:
  enabled: true

# Stone variants: prismarine cross-conversions, purpur pillar,
# blackstone button/pressure plate, quartz pillar/bricks,
# packed mud → mud bricks, basalt polishing, etc.
stone-variants:
  enabled: true

