commands:
  help:
    enabled: true

help:
  # Supports MiniMessage, legacy & colors, and &[MAIN]/&[SECONDARY] placeholders.
  # You can use either this multiline text block or `help.lines` list.
  text: |
    <gradient:#8ec5fc:#e0c3fc><bold>SchalkerSystem Help</bold></gradient>
    &[SECONDARY]Hello, &[MAIN]{player}&[SECONDARY]!
    &[SECONDARY]Online: &[MAIN]{online}&[SECONDARY]/&[MAIN]{max_players}
    &[SECONDARY]Useful commands:
    <yellow>/spawn</yellow> <gray>- return to spawn</gray>
    <yellow>/rtp</yellow> <gray>- random teleport</gray>

