# Включает/выключает быстрое опадание листвы без дерева рядом.
enabled: true

# Через сколько тиков после исчезновения бревна проверять листву рядом с ним.
# Небольшая задержка нужна, чтобы бревно успело реально исчезнуть с сервера
# до того, как мы начнём проверку (иначе оно ещё будет засчитано как живое).
check-delay-ticks: 3

# Предохранитель: сколько блоков листвы максимум обходить за одну проверку связности.
# Если связная группа листвы больше этого числа, она считается "не проверенной
# полностью" и не трогается - чтобы случайно не снести огромную постройку из листвы.
max-leaves-scanned: 512
