name: Crystall Core CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Release (Java 25)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Grant Execute Permissions to Gradle Wrapper
      run: chmod +x gradlew
      
    - name: Run Test Suite
      run: ./gradlew test --no-daemon
      
    - name: Build Fat Release JAR
      run: ./gradlew jar --no-daemon
      
    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: crystall-core-1.0.0
        path: core/build/libs/crystall-core-1.0.0.jar
