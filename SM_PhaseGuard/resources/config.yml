# SM_PhaseGuard — защита от перемещения сквозь блоки (noclip / phase).
#
# Проверка косвенная: сервер смотрит только на то, куда игрок сообщил
# о своём перемещении. Клиентские читы, которые не двигают игрока
# (freecam, ESP, radar), этим модулем не ловятся — они не отправляют
# на сервер ничего.

enabled: true

# BLOCK — отменять перемещение сквозь блоки.
# LOG   — только писать в лог и оповещать модераторов, ничего не блокировать.
#         Начните с LOG на пару дней, если боитесь ложных срабатываний.
mode: BLOCK

detection:
  # Высота луча над ногами игрока, в блоках.
  # Должна быть больше высоты автошага (0.6), иначе подъём по ступенькам
  # и плитам будет считаться нарушением. Меньше 0.61 поставить нельзя.
  ray-height: 0.65

  # Перемещения короче / длиннее этих значений (в блоках) не проверяются.
  # Верхний предел отсекает лаг-скачки и телепорты сторонних плагинов.
  min-distance: 0.08
  max-distance: 8.0

  # Проверять игроков в полёте на элитрах. По умолчанию выключено:
  # на высокой скорости прямая между двумя точками может срезать угол
  # рельефа и дать ложное срабатывание.
  check-while-gliding: false

  # Не проверять игроков в креативе. Полёт в креативе всё равно
  # не проходит сквозь блоки, так что обычно это не нужно.
  ignore-creative: false

  # Блоки, попадание в которые игнорируется. Здесь перечислено то,
  # внутри чего игрок может законно находиться.
  ignored-blocks:
    - LADDER
    - VINE
    - SCAFFOLDING
    - COBWEB
    - POWDER_SNOW
    - BAMBOO
    - BAMBOO_SAPLING
    - TWISTING_VINES
    - TWISTING_VINES_PLANT
    - WEEPING_VINES
    - WEEPING_VINES_PLANT
    - CAVE_VINES
    - CAVE_VINES_PLANT
    - BIG_DRIPLEAF
    - BIG_DRIPLEAF_STEM
    - SMALL_DRIPLEAF
    - SWEET_BERRY_BUSH
    - NETHER_PORTAL
    - END_PORTAL
    - END_GATEWAY

# Время после события, в течение которого игрок не проверяется.
# Нужно, чтобы плагинные телепорты, вход и смена мира не ловились как проход.
grace:
  after-teleport-millis: 2000
  after-join-millis: 4000
  after-respawn-millis: 4000
  after-world-change-millis: 6000

response:
  # Если игрок уже оказался внутри блока (например, его завалило песком),
  # вернуть его на последнюю безопасную точку. Если выключить —
  # такой игрок просто не будет проверяться, пока не выберется сам.
  rescue-from-blocks: true

  notify-player: true
  notify-cooldown-millis: 3000

  # Оповещение игроков с правом phaseguard.alert.
  # Оповещение уходит только после alert-threshold нарушений подряд,
  # чтобы единичное срабатывание не спамило чат.
  alert-staff: true
  alert-threshold: 3
  alert-cooldown-millis: 8000

  # Нарушения подряд считаются в пределах этого окна.
  violation-window-millis: 10000

  # Как часто запоминать безопасную точку игрока.
  safe-point-interval-millis: 1000

# Миры, в которых модуль не работает.
ignored-worlds: []
