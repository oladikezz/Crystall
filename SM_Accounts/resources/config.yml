# SM_Accounts Configuration

# Kick message when player is not linked to Discord
# Available placeholders: {code}, {player_name}
kick-message: |
  &c&lAccount Not Linked!
  
  &7You need to verify your account by going here:
  &b&nhttps://schalker.net/auth/link?code={code}
  
  &7After linking, you can rejoin the server.

# Code expiration time in hours (0 = never expires)
code-expiration-hours: 24

# Hover text for the clickable message
clickable-hover-text: "&bClick to verify your account!"

# Message shown when player is kicked by /unlink command
unlink-kick-message: |
  &cYou have been unlinked by an administrator.
  &7Please rejoin to verify your account.

# ==================== DISCORD BOT SETTINGS ====================

# Discord bot token for guild membership checking and nickname sync.
# Create a bot at https://discord.com/developers/applications
# REQUIRED: Enable "Server Members Intent" in the bot settings on the Developer Portal!
discord-bot:
  enabled: false
  token: "YOUR_BOT_TOKEN_HERE"
  guild-id: "YOUR_GUILD_ID_HERE"

# ==================== GUILD MEMBERSHIP CHECK ====================

# When enabled, linked players will be kicked if they are not in the Discord server.
# The kick message supports color codes and {player_name}, {invite_link} placeholders.
guild-check:
  enabled: true
  invite-link: "https://discord.gg/YOUR_INVITE_CODE"
  kick-message: |
    &c&lNot in Discord Server!

    &7You must be a member of our Discord server to play.
    &7Join here: &b&n{invite_link}

    &7After joining, reconnect to the server.

# ==================== NICKNAME SYNC ====================

# Periodically syncs Minecraft nicknames to Discord server nicknames.
# Only affects players with the configured permission.
# The bot must have "Manage Nicknames" permission and its role must be
# higher than the roles of members whose nicknames it needs to change.
nickname-sync:
  enabled: true
  interval-minutes: 10
  # Players must have at least one of these permissions (checked via LuckPerms/Bukkit)
  permissions:
    - "smaccs.nicknamesync"
    - "discordsrv.nicknamesync"

# Messages for /nicksync command
nicksync-messages:
  no-permission: "&[MAIN]You do not have permission to use this command."
  bot-not-ready: "&[MAIN]Discord bot is not connected. Check config and console."
  db-error: "&[MAIN]Database not available."
  no-players: "&7No players online to sync."
  interrupted: "&[MAIN]Nickname sync was interrupted."
  player-not-found: "&[MAIN]Could not find player: &[SECONDARY]{player}"
  player-not-linked: "&7Skipped &[SECONDARY]{player} &7- not linked to Discord."
  player-synced: "&[SECONDARY]✓ &fSynced &[SECONDARY]{player}"
  player-failed: "&c✗ &fFailed to sync &c{player}"
  sync-all-start: "&[MAIN]&lStarting nickname sync for &[SECONDARY]{count} &[MAIN]&lonline player(s)..."
  sync-all-complete: "&[MAIN]&l=== Nickname Sync Complete ===\n&[SECONDARY]{success} &7synced, &[SECONDARY]{skipped} &7skipped, &c{failed} &7failed &7(of {total} total)"
  sync-player-start: "&[MAIN]Syncing nickname for &[SECONDARY]{player}&[MAIN]..."

# ==================== UNLINK COMMAND MESSAGES ====================

unlink-messages:
  no-permission: "&[MAIN]У вас нет прав для использования этой команды."
  usage: "&[MAIN]Использование: &[SECONDARY]/unlink <никнейм> &7— предпросмотр, &[SECONDARY]/unlink <никнейм> --confirm &7— подтверждение"
  db-error: "&[MAIN]База данных недоступна."
  not-found: "&[MAIN]Игрок &[SECONDARY]{player} &[MAIN]не найден в sm_accounts."
  site-db-error: "&c├ Ошибка подключения к s3_SchalkerSiteDB"
  preview-header: "&[MAIN]&l=== Предпросмотр удаления: {player} ==="
  preview-confirm: "&c&l⚠ &[MAIN]Для подтверждения: &[SECONDARY]/unlink {player} --confirm\n&7Подтверждение действительно 60 секунд."
  no-pending: "&[MAIN]Нет ожидающего подтверждения для &[SECONDARY]{player}&[MAIN]. Сначала выполните &[SECONDARY]/unlink {player}"
  success: "&a✓ &fАккаунт &[SECONDARY]{player} &fполностью удалён."

# ==================== TWINK SETTINGS ====================

# Whether to sync punishments (bans, mutes, warns) across main and twink accounts
# Requires LiteBans plugin
#
# Sync direction:
#   - Punishing the MAIN account → syncs to all twinks
#   - Punishing a TWINK → syncs to other twinks (exempt accounts are skipped)
#   - To protect specific accounts (admins, owners), give them the
#     "smaccs.sync.exempt" permission or add them to sync-exempt-players below
sync-punishments: true

# Players exempt from synced punishments (for offline players).
# Online players with the "smaccs.sync.exempt" permission are also exempt.
sync-exempt-players:
  # - SomeAdminName

# Reasons used when syncing punishments
# Placeholders:
# {origin} - the player who received the original punishment
# {original_reason} - the original reason (if available/parsed, otherwise empty)
sync-reasons:
  ban: "Synced ban from {origin}"
  mute: "Synced mute from {origin}"
  warn: "Synced warn from {origin}"
  unban: "Synced unban from {origin}"
  unmute: "Synced unmute from {origin}"
  unwarn: "Synced unwarn from {origin}"


# Messages for twink commands
twink-messages:
  # Translations
  you: "You"
  self: "self"

  # Error messages
  not-a-twink: "&[MAIN]{player} is not registered as a twink account."
  not-a-main: "&[MAIN]{player} is a twink account, not a main account."
  already-a-twink: "&[MAIN]{player} is already a twink of {main}."
  already-a-main: "&[MAIN]{player} is a main account with twinks. Remove those first."
  same-player: "&[MAIN]Main and twink cannot be the same player."
  player-not-found: "&[MAIN]Could not find player: {player}"
  no-permission: "&[MAIN]You do not have permission to use this command."
  player-only: "&[MAIN]This command can only be used by players."
  db-error: "&[MAIN]Database not available."
  failed-add: "&[MAIN]Failed to add twink. Check console for errors."
  failed-remove: "&[MAIN]Failed to remove twink. Check console for errors."

  # Success messages
  twink-added: "&[SECONDARY]Successfully added &f{twink} &[SECONDARY]as a twink of &f{main}&[SECONDARY]."
  twink-removed: "&[SECONDARY]Successfully removed &f{twink} &[SECONDARY]as a twink of &f{main}&[SECONDARY]."
  executed-whitelist-lp: "&7Executed whitelist and LuckPerms commands."
  executed-whitelist-lp-remove: "&7Executed whitelist removal and LuckPerms commands."

  # Info messages
  no-twinks: "&7{player} has no registered twink accounts."
  no-relationship: "&7{player} has no twink relationships."
  you-are-twink:
    - "&[MAIN]You are a twink account of &[SECONDARY]{main}&[MAIN]."
    - "&[MAIN]Ask an administrator to view your twinks."

  # Headers/Lists
  header-your-twinks: "&[MAIN]&l=== Your Twink Accounts ==="
  header-twink-info: "&[MAIN]&l=== Twink Info: {player} ==="
  header-twinks-for: "&[MAIN]&l=== Twinks for {player} ==="
  total-twinks: "&7Total: &[SECONDARY]{count} &7twink(s)"
  is-twink-of: "&[SECONDARY]{twink} is a twink of {main}. Showing twinks for {main}:"

  # Info details
  status-twink: "&7Status: &[SECONDARY]Twink Account"
  status-main: "&7Status: &[SECONDARY]Main Account"
  status-regular: "&7Status: &[SECONDARY]Regular Account"
  info-main-account: "&7Main Account: &[SECONDARY]{main}"
  info-linked-at: "&7Linked At: &[SECONDARY]{date}"
  info-twink-count: "&7Twink Count: &[SECONDARY]{count}"
  info-twinks-list: "&7Twinks: &[SECONDARY]{list}"

  # Usage
  usage-header: "&[MAIN]&l=== Twink Management ==="
  usage-add: "&[SECONDARY]/twink add <main> <twink> &7- Add a twink to a main account"
  usage-remove: "&[SECONDARY]/twink remove <twink> &7- Remove a twink account"
  usage-list: "&[SECONDARY]/twink list <main> &7- List all twinks for a main account"
  usage-info: "&[SECONDARY]/twink info <player> &7- Get info about a player's twink status"
  invalid-usage-add: "&[MAIN]Usage: &[SECONDARY]/twink add <main> <twink>"
  invalid-usage-remove: "&[MAIN]Usage: &[SECONDARY]/twink remove <twink>"
  invalid-usage-list: "&[MAIN]Usage: &[SECONDARY]/twink list <main>"
  invalid-usage-info: "&[MAIN]Usage: &[SECONDARY]/twink info <player>"
