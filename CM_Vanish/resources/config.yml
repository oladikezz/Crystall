# SM_Vanish Configuration

# Whether to persist vanish state across server restarts/rejoins
persist-vanish-state: true

# Messages configuration
messages:
  # Message shown when a player enables vanish
  vanish-enabled: "&fVanish - &aenabled"
  # Message shown when a player disables vanish
  vanish-disabled: "&fVanish - &cdisabled"
  # Fake quit message sent to other players (use {player} for player name)
  fake-quit: "&e[-] {player}"
  # Fake join message sent to other players (use {player} for player name)
  fake-join: "&e[+] {player}"
  # Action bar message shown while vanished (persistent)
  actionbar-vanished: "&aVanished"
  # Message shown when player joins server while still in vanish
  silent-join: "&7You've joined the server in vanish, silently."

  # Incognito mode messages
  incognito-enabled: "&fIncognito - &aenabled"
  incognito-disabled: "&fIncognito - &cdisabled"

  vanishlist-empty: "&[MAIN]There are no vanished players currently."
  vanishlist-format: "&[MAIN]Vanished players ({count}): &f{players}"

# PlaceholderAPI settings
placeholders:
  # Output for %vanish_state%
  state:
    vanished: "&7[Vanished]"
    visible: ""

# Integration settings
integrations:
  # Enable PlaceholderAPI integration
  placeholderapi: true
  # Enable SimpleVoiceChat integration (hides vanished players in voice chat)
  simplevoicechat: true

